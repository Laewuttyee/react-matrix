name: Containerized CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  deploy-container:
    name: 🚀 Deploy Containerized App to VM
    runs-on: self-hosted

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐳 Pull Latest Image & Restart Container
        run: |
          echo " Starting Containerized Deployment..."
          cd ~/react-matrix
          docker compose pull
          docker compose up -d --remove-orphans          
          docker image prune -f
          echo " Deployment Completed Successfully! 🎉"
