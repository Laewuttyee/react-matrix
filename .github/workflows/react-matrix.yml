name: The Automated Container Delivery Capstone Project
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
env:
  PROJECT_NODE_ENV: production
  DOCKERHUB_REPO_NAME: laewuttyee/flower-boutique-app
jobs:
  code-quality-check:
    name: 🧪 Lint & Build Check
    runs-on: ubuntu-latest
    steps:
     - name: 📥 Checkout Code
       uses: actions/checkout@v4
     - name: 🟢 Setup Node.js v20
       uses: actions/setup-node@v4
       with:
        node-version: 20
        cache: 'npm'
     - name: 📦 Install Dependencies
       run: npm install
     - name: 🚨 Run Linter (Code Style Check)
       run: npm run lint

     - name: 🏗️  Test Production Build
       run: npm run build
       env:
         CI: true
         NODE_ENV: ${{ env.PROJECT_NODE_ENV }}
  release-to-dockerhub:
    name: Build  & Push to Docker Hub
    runs-on: ubuntu-latest
    needs: code-quality-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
     - name: 📥 Checkout Code
       uses: actions/checkout@v4
     - name: 🔑 Log in to Docker Hub
       uses: docker/login-action@v3
       with:
         username: ${{ secrets.DOCKERHUB_USERNAME }}
         password: ${{ secrets.DOCKERHUB_TOKEN }}
     - name: 🐋 6. Set up Docker Buildx
       uses: docker/setup-buildx-action@v3
     - name: 🏗️🚀7. Build and Push Docker Image
       uses: docker/build-push-action@v6
       with:
         context: .
         file: ./Dockerfile
         push: true
         tags: |
           ${{ env.DOCKERHUB_REPO_NAME }}:node${{ matrix.node-version }}
           ${{ env.DOCKERHUB_REPO_NAME }}:latest
