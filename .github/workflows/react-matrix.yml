name: Production Ready React Frontend CI/CD to  Docker Hub
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
env:
  PROJECT_NODE_ENV: production
  DOCKERHUB_REPO_NAME: laewuttyee/flower-boutique-app
jobs:
  frontend-matrix-build:
    name: Build React (Node v${{matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
       node-version: [20.x, 22.x]
    steps:
     - name: 📥 1. Checkout Code
       uses: actions/checkout@v4
     - name: 🟢 2. Setup Node.js v${{ matrix.node-version }}
       uses: actions/setup-node@v4
       with:
        node-version: ${{ matrix.node-version }}
     - name: 📦 3. Install Dependencies
       run: npm install
     - name: 🏗️ 4. Build React Application
       run: npm run build
       env:
         NODE_ENV: ${{ env.PROJECT_NODE_ENV }}
     - name: 🔑 5. Log in to Docker Hub
       uses: docker/login-action@v3
       with:
         username: ${{ secrets.DOCKERHUB_USERNAME }}
         password: ${{ secrets.DOCKERHUB_TOKEN }}
     - name: 🐋 6. Set up Docker Buildx
       uses: docker/setup-buildx-action@v3
     - name: 🏗️🚀7. Build and Push Docker Image
       uses: docker/build-push-action@v6
       with:
         context: .
         file: ./Dockerfile
         push: true
         tags: |
           ${{ env.DOCKERHUB_REPO_NAME }}:node${{ matrix.node-version }}
           ${{ env.DOCKERHUB_REPO_NAME }}:latest
