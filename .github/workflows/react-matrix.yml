name: Modern React Frontend Matrix CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
env:
  PROJECT_NODE_ENV: production
  CI: true
jobs:
  frontend-matrix-build:
    name: Build React (Node v${{matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
       node-version: [20.x, 22.x]
    steps:
     - name: 📥 1. Checkout Code
       uses: actions/checkout@v4
     - name: 🟢 2. Setup Node.js v${{ matrix.node-version }}
       uses: actions/setup-node@v4
       with:
        node-version: ${{ matrix.node-version }}
     - name: 📦 3. Install Dependencies
       run: npm install
     - name: 🏗️ 4. Build React Application
       run: npm run build
       env:
         NODE_ENV: ${{ env.PROJECT_NODE_ENV }}
