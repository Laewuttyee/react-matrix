name: Failure Handling & Telegram Alert

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest # သို့မဟုတ် ညီလေးရဲ့ self-hosted runner

    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v3

      - name: 🧪 Run Tests (Simulate Failure)
        run: |
          echo "Running automated test suites..."
          exit 1

      - name: 🚀 Deploy Application
        run: echo "Deploying to server..."

      - name: 🔔 Send Telegram Alert on Failure
        if: failure() 
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MESSAGE="🚨 *Pipeline Alert!*%0A%0A*Repo:* ${{ github.repository }}%0A*Branch:* ${{ github.ref_name }}%0A*Status:* Failed ❌%0A*Commit:* ${{ github.sha }}"
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=${MESSAGE}" \
            -d "parse_mode=Markdown"
